version: '3.8'

services:
  expo:
    build:
      context: .
      dockerfile: .dockerfile/prod/prod-app.Dockerfile
    working_dir: /app
    volumes:
      - ./app:/app
      # Prevent node_modules from being overwritten by host
      - /app/node_modules
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - EXPO_PUBLIC_BASE_URL=${EXPO_PUBLIC_BASE_URL:-http://localhost:8080}
      # Critical for proper Metro bundler connectivity
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"