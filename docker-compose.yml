services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: ../.docker/prod/prod-backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEFAULT_MANAGER_NAME: ${DEFAULT_MANAGER_NAME}
      DEFAULT_MANAGER_PIN: ${DEFAULT_MANAGER_PIN}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      dockerfile: ../.docker/prod/prod-web.Dockerfile
    ports:
      - "${WEB_PORT:-80}:8080"  # Map host 80 to container 8080
    depends_on:
      - api
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata_prod: