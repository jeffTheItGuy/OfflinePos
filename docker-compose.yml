services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Note: In production, it is safer to NOT expose the DB port to the host.
    # If you need it for backups, uncomment the lines below.
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: ../.docker/prod/prod-backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  web:
    build:
      context: ./web
      dockerfile: ../.docker/prod/prod-web.Dockerfile
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:-http://api:8000}
    ports:
      # Defaulting to port 80 for production web traffic
      - "${WEB_PORT:-80}:80" 
    depends_on:
      - api
    restart: always

volumes:
  pgdata_prod: