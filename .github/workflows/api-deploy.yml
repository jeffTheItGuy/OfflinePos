name: API Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NAMESPACE: offlinepos
  RELEASE_NAME: api-release
  DEPLOYMENT_NAME: offlinepos-api
  SERVICE_PORT: "8000"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi
          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          for i in 1 2 3; do
            if ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key captured."
              break
            fi
            echo "ssh-keyscan attempt $i failed."
            if [ "$i" -eq 3 ]; then
              echo "❌ Could not reach $REMOTE_SERVER:22 for ssh-keyscan." >&2
              exit 1
            fi
            sleep 10
          done
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connectivity
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" "echo SSH OK"; then
              echo "✅ SSH connectivity confirmed."
              exit 0
            fi
            echo "⚠️ SSH connectivity attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "❌ Could not SSH to $REMOTE_SERVER after 5 attempts." >&2
          exit 1

      - name: Copy Files to Remote
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/api-${{ github.run_id }}
        run: |
          set -euo pipefail
          
          # FIX: Removed '$REMOTE_WORKSPACE/backend' from mkdir
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            "rm -rf '$REMOTE_WORKSPACE' && mkdir -p '$REMOTE_WORKSPACE/.helm' '$REMOTE_WORKSPACE/.docker/prod'"
            
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r .helm/api \
            "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.helm/"
            
          # CRITICAL FIX: Dump backend contents directly into the workspace root
          # so Docker can find 'requirements.txt' and 'app/'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r backend/* \
            "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/"
            
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes .docker/prod/prod-api.Dockerfile \
            "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.docker/prod/"

      - name: Build and Deploy on Remote Server
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/api-${{ github.run_id }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_number }}
          RESTART_REASON: github-actions-deploy
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            RESTART_REASON="$RESTART_REASON" \
            BUILD_ID="$BUILD_ID" \
            REMOTE_WORKSPACE="$REMOTE_WORKSPACE" \
            NAMESPACE="$NAMESPACE" \
            DEPLOYMENT_NAME="$DEPLOYMENT_NAME" \
            RELEASE_NAME="$RELEASE_NAME" \
            SERVICE_PORT="$SERVICE_PORT" \
            bash << 'ENDSSH'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd "$REMOTE_WORKSPACE"

          docker system prune -f
          docker builder prune -f

          docker build --no-cache -f .docker/prod/pro