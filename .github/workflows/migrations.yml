name: Database Migrations

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

env:
  NAMESPACE: offlinepos
  POSTGRES_DEPLOYMENT: offlinepos-postgresql
  POSTGRES_SERVICE: offlinepos-postgresql-svc
  POSTGRES_DB: offlinepos
  PYTHON_IMAGE: python:3.12-slim

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi

          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          for i in 1 2 3; do
            if ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key captured."
              break
            fi

            echo "ssh-keyscan attempt $i failed."

            if [ "$i" -eq 3 ]; then
              echo "❌ Could not reach $REMOTE_SERVER:22 for ssh-keyscan." >&2
              exit 1
            fi

            sleep 10
          done

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connectivity
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail

          for i in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" "echo SSH OK"; then
              echo "✅ SSH connectivity confirmed."
              exit 0
            fi

            echo "⚠️ SSH connectivity attempt $i failed. Retrying in 10s..."
            sleep 10
          done

          echo "❌ Could not SSH to $REMOTE_SERVER after 5 attempts." >&2
          exit 1

      - name: Validate Alembic files
        run: |
          set -euo pipefail

          if [ ! -f backend/alembic.ini ]; then
            echo "❌ backend/alembic.ini not found." >&2
            exit 1
          fi

          if [ ! -d backend/alembic/versions ]; then
            echo "❌ backend/alembic/versions not found." >&2
            exit 1
          fi

          echo "✅ Alembic migration files found."

      - name: Copy backend to Remote
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/migrations-${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "Preparing remote workspace..."
          for i in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" \
              "rm -rf '$REMOTE_WORKSPACE' && mkdir -p '$REMOTE_WORKSPACE'"; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "❌ Failed to prepare remote workspace." >&2
              exit 1
            fi

            echo "⚠️ Workspace preparation failed. Retrying in 10s... ($i/5)"
            sleep 10
          done

          echo "Archiving backend..."
          tar --exclude='*.pyc' --exclude='__pycache__' --exclude='.pytest_cache' -czf backend.tar.gz backend

          echo "Copying archive to remote..."
          for i in 1 2 3 4 5; do
            if scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 backend.tar.gz \
              "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/backend.tar.gz"; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "❌ Failed to copy backend archive." >&2
              exit 1
            fi

            echo "⚠️ SCP failed. Retrying in 10s... ($i/5)"
            sleep 10
          done

          echo "Extracting archive on remote..."
          for i in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" \
              "cd '$REMOTE_WORKSPACE' && tar -xzf backend.tar.gz && rm -f backend.tar.gz"; then
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "❌ Failed to extract backend archive." >&2
              exit 1
            fi

            echo "⚠️ Extraction failed. Retrying in 10s... ($i/5)"
            sleep 10
          done

          rm -f backend.tar.gz

      - name: Run Alembic migrations on Remote Server
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/migrations-${{ github.run_id }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" \
            REMOTE_WORKSPACE="$REMOTE_WORKSPACE" \
            NAMESPACE="$NAMESPACE" \
            POSTGRES_DEPLOYMENT="$POSTGRES_DEPLOYMENT" \
            POSTGRES_SERVICE="$POSTGRES_SERVICE" \
            POSTGRES_DB="$POSTGRES_DB" \
            PYTHON_IMAGE="$PYTHON_IMAGE" \
            bash << 'ENDSSH'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          cd "$REMOTE_WORKSPACE"
          WORKSPACE_ABS="$(pwd)"

          if ! command -v docker >/dev/null 2>&1; then
            echo "❌ docker is not available on the remote server." >&2
            exit 1
          fi

          if [ ! -f backend/alembic.ini ]; then
            echo "❌ backend/alembic.ini not found on remote server." >&2
            exit 1
          fi

          if [ ! -d backend/alembic/versions ]; then
            echo "❌ backend/alembic/versions not found on remote server." >&2
            exit 1
          fi

          echo "Pulling migration runtime image: $PYTHON_IMAGE"
          if ! docker pull "$PYTHON_IMAGE"; then
            echo "❌ Failed to pull $PYTHON_IMAGE." >&2
            exit 1
          fi

          urlencode() {
            local s="$1" out="" c i

            for ((i=0; i<${#s}; i++)); do
              c="${s:$i:1}"

              case "$c" in
                [a-zA-Z0-9.~_-]) out+="$c" ;;
                *) out+="$(printf '%%%02X' "'$c")" ;;
              esac
            done

            printf '%s' "$out"
          }

          DB_USER=$(kubectl get secret offlinepos-secrets -n "$NAMESPACE" -o jsonpath='{.data.DATABASE_USER}' | base64 -d)
          DB_PASS=$(kubectl get secret offlinepos-secrets -n "$NAMESPACE" -o jsonpath='{.data.DATABASE_PASSWORD}' | base64 -d)

          DB_USER_ENC="$(urlencode "$DB_USER")"
          DB_PASS_ENC="$(urlencode "$DB_PASS")"

          echo "Waiting for PostgreSQL deployment..."
          kubectl wait --for=condition=available --timeout=300s "deployment/$POSTGRES_DEPLOYMENT" -n "$NAMESPACE"

          PF_PORT=$((15000 + RANDOM % 10000))
          PF_LOG="/tmp/alembic-port-forward-$$.log"
          DSN="postgresql+psycopg://${DB_USER_ENC}:${DB_PASS_ENC}@127.0.0.1:${PF_PORT}/${POSTGRES_DB}"

          cleanup() {
            if [ -n "${PF_PID:-}" ]; then
              kill "$PF_PID" 2>/dev/null || true
              sleep 2
              kill -9 "$PF_PID" 2>/dev/null || true
              wait "$PF_PID" 2>/dev/null || true
            fi

            rm -f "$PF_LOG" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Starting port-forward to $POSTGRES_SERVICE on localhost:${PF_PORT}"
          kubectl port-forward "svc/$POSTGRES_SERVICE" "${PF_PORT}:5432" -n "$NAMESPACE" </dev/null >"$PF_LOG" 2>&1 &
          PF_PID=$!

          echo "Waiting for port-forward to become ready..."
          for i in $(seq 1 60); do
            if bash -c "exec 3<>/dev/tcp/127.0.0.1/${PF_PORT}" 2>/dev/null; then
              echo "✅ Port-forward is ready."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "❌ Port-forward did not become ready within 60 seconds." >&2
              echo "Port-forward logs:" >&2
              cat "$PF_LOG" >&2 || true
              exit 1
            fi

            sleep 1
          done

          echo "Running Alembic migrations..."
          docker run --rm --network host \
            -e DATABASE_URL="$DSN" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 \
            -v "$WORKSPACE_ABS/backend:/app/backend:ro" \
            -w /app/backend \
            "$PYTHON_IMAGE" \
            sh -c 'pip install --no-cache-dir --disable-pip-version-check -r requirements.txt && echo "Current Alembic revision before upgrade:" && (alembic current || true) && alembic upgrade head && echo "Current Alembic revision after upgrade:" && alembic current'

          echo "✅ Alembic migrations applied successfully."
          ENDSSH

      - name: Cleanup Remote Workspace
        if: always()
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/migrations-${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_SERVER:-}" ] || [ -z "${REMOTE_USER:-}" ] || [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "Skipping cleanup because SSH is not fully configured." >&2
            exit 0
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$REMOTE_USER@$REMOTE_SERVER" \
            "rm -rf '$REMOTE_WORKSPACE'" || true
