name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Third-party dependency vulnerabilities (Trivy) ───────────────
  dependency-scan:
    name: Dependency vuln scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan backend Python deps
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan web JS deps
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'web'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan tablet (Expo) JS deps
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ── 2. Ecosystem-native audits ──────────────────────────────────────
  ecosystem-audit:
    name: pip-audit + npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend Python deps
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit web JS deps (prod only)
        working-directory: web
        # --omit=dev ignores Vite/esbuild dev-server vulnerabilities which 
        # only affect local development, not the production Nginx build.
        run: npm audit --audit-level=high --omit=dev

      - name: Audit tablet JS deps (prod only)
        working-directory: app
        run: npm audit --audit-level=high --omit=dev

  # ── 3. IaC / Dockerfile misconfiguration scan ───────────────────────
  iac-scan:
    name: IaC & Dockerfile scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan IaC (Dockerfiles, nginx, compose, Helm)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Skip dev dockerfiles (intentionally root for bind mounts) and noise
          skip-dirs: 'node_modules,.git,test-results,.docker/dev'

  # ── 4. Secret scanning ──────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'          # 'secret' is no longer a top-level command
          scanners: 'secret'       # Tell Trivy to ONLY look for secrets
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: 'node_modules,.git,test-results'