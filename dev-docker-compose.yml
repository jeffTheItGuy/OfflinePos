

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harbor
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../.docker/dev/dev-backend.Dockerfile
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/harbor
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: ../.docker/dev/dev-web.Dockerfile
    volumes:
      - ./web:/app
      # Named volume keeps container-installed node_modules from being
      # shadowed by the ./web bind mount above.
      - web_node_modules:/app/node_modules
    environment:
      # The Vite proxy runs inside this container, so "localhost" would be
      # the web container itself. Target the api service by name.
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata_dev:
  web_node_modules: