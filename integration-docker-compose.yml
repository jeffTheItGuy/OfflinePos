services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MobileToServer-POS_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: ./backend
      dockerfile: ../.docker/test/test-backend.Dockerfile
    environment:
      PYTHONPATH: /
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/MobileToServer-POS_test
      DEFAULT_MANAGER_NAME: Test Admin
      DEFAULT_MANAGER_PIN: "1234"
    depends_on:
      db:
        condition: service_healthy