server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Tablet APK downloads ──
    location /downloads/ {
        alias /srv/downloads/;
        add_header Content-Disposition "attachment";
        types { application/vnd.android.package-archive apk; }
        expires 1h;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: /admin, /admin/staff, /kitchen are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
}