apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offlinepos-web-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: offlinepos-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Allow traffic from kube-system (default for k3s Traefik)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
        # Allow traffic if Traefik is deployed in its own namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "traefik"
      ports:
        - protocol: TCP
          # CRITICAL FIX: NetworkPolicies operate at the Pod/Container level.
          # We must allow the targetPort (8080), NOT the Service port (80).
          port: {{ .Values.service.targetPort | default .Values.service.port }}
  egress:
    {{- range .Values.networkPolicy.allowedTo }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .app }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53