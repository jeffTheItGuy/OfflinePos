apiVersion: v1
kind: Service
metadata:
  name: offlinepos-web-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: offlinepos-web
spec:
  type: {{ .Values.service.type }}
  selector:
    app: offlinepos-web
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
